<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GAMBA｜SPI 復習</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><style>:root{--bg:#f6f4ef;--sf:#fff;--sf2:#f0ede6;--bd:#d6d2c8;--bd2:#bcb8ae;--pink:#d93652;--teal:#0d9478;--blue:#2055b0;--amber:#a86000;--tl:#e6f5f1;--bl:#eaf0fb;--al:#fdf2dd;--pl:#fde8eb;--text:#1a1814;--text2:#58544c;--text3:#98948c;--r:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;}
.site-header{background:var(--sf);border-bottom:1px solid var(--bd);padding:.65rem 1.5rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.logo{font-family:'Shippori Mincho',serif;font-size:1.05rem;color:var(--pink);}
.logo-sep{color:var(--bd2);}
.logo-sub{font-size:12px;color:var(--text2);}
.tab-nav{background:var(--sf);border-bottom:2px solid var(--bd);position:sticky;top:46px;z-index:99;display:flex;padding:0 1rem;}
.tab-btn{padding:.7rem 1.4rem;font-size:13px;font-weight:500;color:var(--text2);background:none;border:none;cursor:pointer;font-family:'Noto Sans JP',sans-serif;display:flex;align-items:center;gap:7px;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .15s;white-space:nowrap;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active-ex{color:var(--pink);border-bottom-color:var(--pink);}
.tab-btn.active-pr{color:var(--blue);border-bottom-color:var(--blue);}
.tab-btn.active-cf{color:var(--amber);border-bottom-color:var(--amber);}
.tab-pip{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.pip-ex{background:#fde8eb;color:var(--pink);}
.pip-pr{background:var(--bl);color:var(--blue);}
.pip-cf{background:var(--al);color:var(--amber);}
.tab-done{width:16px;height:16px;border-radius:50%;background:var(--teal);color:#fff;font-size:9px;display:none;align-items:center;justify-content:center;}
.page{display:none;animation:fadeTab .2s ease;}
.page.active{display:block;}
@keyframes fadeTab{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
main{max-width:720px;margin:0 auto;padding:1.5rem 1rem 6rem;}
.page-hdr{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1rem 1.4rem;margin-bottom:1.4rem;display:flex;align-items:center;gap:12px;}
.page-hdr-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:700;flex-shrink:0;}
.icon-ex{background:var(--pink);color:#fff;}.icon-pr{background:var(--blue);color:#fff;}.icon-cf{background:var(--amber);color:#fff;}
.page-hdr-body{flex:1;}
.page-hdr-title{font-size:15px;font-weight:700;margin-bottom:2px;}
.page-hdr-desc{font-size:12px;color:var(--text2);}
.prog-wrap{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.8rem 1.2rem;margin-bottom:1.2rem;display:flex;align-items:center;gap:12px;}
.pb-w{flex:1;height:6px;background:var(--bd);border-radius:3px;overflow:hidden;}
.pb{height:100%;border-radius:3px;transition:width .4s;}
.pb-pr{background:var(--blue);}.pb-cf{background:var(--amber);}
.pb-txt{font-size:12px;color:var(--text2);white-space:nowrap;}
.next-page-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:var(--sf);border:1.5px solid var(--bd);border-radius:var(--r);font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all .15s;margin-top:.5rem;text-decoration:none;}
.next-page-btn.pr{border-color:var(--blue);color:var(--blue);background:var(--bl);}
.next-page-btn.cf{border-color:var(--amber);color:var(--amber);background:var(--al);}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1rem;}
.clabel{font-size:11px;font-weight:700;letter-spacing:.1em;margin-bottom:.85rem;display:flex;align-items:center;gap:6px;}
.clabel::before{content:'';width:3px;height:14px;border-radius:2px;display:inline-block;}
.clabel.ex{color:var(--pink);}.clabel.ex::before{background:var(--pink);}
.clabel.pr{color:var(--blue);}.clabel.pr::before{background:var(--blue);}
.clabel.cf{color:var(--amber);}.clabel.cf::before{background:var(--amber);}
.clabel.kai{color:var(--teal);}.clabel.kai::before{background:var(--teal);}
.q-text{font-size:15px;line-height:2;color:var(--text);margin-bottom:1rem;}
.body-text{font-size:14px;line-height:2.1;color:var(--text);margin-bottom:.9rem;}
.point-box{background:var(--al);border:1px solid #e0c888;border-radius:9px;padding:.9rem 1.2rem;margin-bottom:.9rem;font-size:13px;color:var(--amber);line-height:1.9;}
.point-box strong{display:block;font-size:10px;letter-spacing:.08em;margin-bottom:4px;}
.teal-box{background:var(--tl);border:1px solid #8ecfc3;border-radius:9px;padding:.9rem 1.2rem;margin-bottom:.9rem;font-size:14px;color:#0a6b54;line-height:2;}
.teal-box strong{display:block;font-size:10px;letter-spacing:.08em;margin-bottom:4px;color:var(--teal);}
.pink-box{background:var(--pl);border:1px solid #f0b8c0;border-radius:9px;padding:.9rem 1.2rem;margin-bottom:.9rem;font-size:14px;color:#8b1a2c;line-height:2;}
.pink-box strong{display:block;font-size:10px;letter-spacing:.08em;margin-bottom:4px;color:var(--pink);}
.kansan-table{width:100%;border-collapse:collapse;margin:.9rem 0;font-size:14px;}
.kansan-table th{background:var(--pl);color:var(--pink);font-weight:700;padding:9px 12px;border:1.5px solid #f0b8c0;text-align:center;font-size:12px;}
.kansan-table td{padding:9px 12px;border:1.5px solid #f0b8c0;text-align:center;background:#fff;font-size:14px;line-height:1.6;}
.kansan-table .hi{background:#fff8e1;font-weight:700;color:var(--amber);}
.kansan-table .hig{background:var(--tl);font-weight:700;color:var(--teal);}
.formula-box{background:var(--bl);border:2px solid var(--blue);border-radius:10px;padding:1rem 1.2rem;margin:1rem 0;}
.formula-box .f-title{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.08em;margin-bottom:.6rem;}
.formula-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:.35rem 0;font-size:14px;}
.f-key{display:inline-block;background:var(--blue);color:#fff;border-radius:5px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;}
.f-eq{font-size:15px;font-weight:700;color:#1a3a7a;}
.sec-head{display:flex;align-items:center;gap:10px;background:var(--pink);color:#fff;border-radius:9px 9px 0 0;padding:.7rem 1.1rem;margin:-1.4rem -1.5rem 1.2rem;font-size:14px;font-weight:700;}
.sec-num{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.exp-box{background:var(--sf2);border-radius:9px;padding:.9rem 1.15rem;margin-bottom:.75rem;border-left:3px solid var(--teal);animation:fadeIn .25s ease;}
.exp-box h4{font-size:11px;color:var(--teal);font-weight:700;letter-spacing:.06em;margin-bottom:.4rem;}
.exp-box p{font-size:14px;line-height:2;color:var(--text);white-space:pre-wrap;}
.exp-box.blue{border-color:var(--blue);}.exp-box.blue h4{color:var(--blue);}
.exp-box.amber{border-color:var(--amber);}.exp-box.amber h4{color:var(--amber);}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.reveal-btn{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-top:.2rem;transition:background .15s;}
.reveal-btn:hover{background:#0b7560;}
.kai-card{display:none;border-top:3px solid var(--teal);animation:slideDown .3s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.connector{display:none;flex-direction:column;align-items:center;margin:-.5rem 0;position:relative;z-index:2;}
.connector-line{width:2px;height:20px;background:var(--teal);}
.connector-arrow{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid var(--teal);}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:1rem;}
.ch{background:var(--sf2);border:1.5px solid var(--bd);border-radius:9px;padding:10px 8px;font-size:14px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s;font-family:'Noto Sans JP',sans-serif;width:100%;}
.ch:hover:not(:disabled){border-color:var(--blue);background:var(--bl);}
.ch:disabled{cursor:default;}
.ch.ok{border-color:var(--teal);background:var(--tl);color:var(--teal);}
.ch.ng{border-color:var(--pink);background:var(--pl);color:var(--pink);}
.cnum{width:24px;height:24px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.ch.ok .cnum{background:var(--teal);color:#fff;}
.ch.ng .cnum{background:var(--pink);color:#fff;}
.mini-choices{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:.8rem;}
.mch{background:#faf8ff;border:1.5px solid #c8b8e8;border-radius:9px;padding:9px 8px;font-size:14px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s;font-family:'Noto Sans JP',sans-serif;width:100%;}
.mch:hover:not(:disabled){border-color:#7b3f9e;background:#f0e8fa;}
.mch:disabled{cursor:default;}
.mch.ok{border-color:var(--teal);background:var(--tl);color:var(--teal);}
.mch.ng{border-color:var(--pink);background:var(--pl);color:var(--pink);}
.mcnum{width:22px;height:22px;border-radius:50%;background:#c8b8e8;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;color:#5a2d91;}
.mch.ok .mcnum{background:var(--teal);color:#fff;}
.mch.ng .mcnum{background:var(--pink);color:#fff;}
.timer-wrap{display:flex;align-items:center;gap:10px;margin-bottom:1rem;}
.timer-ring{position:relative;width:48px;height:48px;flex-shrink:0;}
.timer-ring svg{width:48px;height:48px;transform:rotate(-90deg);}
circle{fill:none;stroke-width:3;stroke-linecap:round;}
.tbg{stroke:var(--bd2);}
.tfg{stroke:var(--teal);transition:stroke-dashoffset .9s linear;stroke-dasharray:126;stroke-dashoffset:0;}
.tfg.warn{stroke:var(--amber);}
.tcenter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text2);font-family:'DM Mono',monospace;}
.timer-msg{font-size:13px;color:var(--text2);line-height:1.5;}
.timer-msg .goal{color:var(--teal);font-weight:500;}
.hint-toggle{background:none;border:1px dashed var(--bd);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text2);cursor:pointer;margin-bottom:.75rem;font-family:'Noto Sans JP',sans-serif;transition:all .15s;}
.hint-toggle:hover{border-color:var(--blue);color:var(--blue);}
.hint-box{background:var(--bl);border:1px solid #a8c0e8;border-radius:9px;padding:.75rem 1rem;margin-bottom:.85rem;font-size:13px;color:var(--blue);line-height:1.9;display:none;}
.abc-wrap{margin-top:1.2rem;padding-top:1.2rem;border-top:1px solid var(--bd);}
.abc-lbl{font-size:12px;color:var(--text2);margin-bottom:.7rem;}
.abc-row{display:flex;gap:7px;}
.abc-btn{flex:1;padding:9px 5px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid;transition:all .15s;font-family:'Noto Sans JP',sans-serif;text-align:center;line-height:1.3;}
.abc-btn span{display:block;font-size:10px;font-weight:400;margin-top:2px;opacity:.85;}
.abc-A{border-color:var(--teal);color:var(--teal);background:var(--tl);}
.abc-A:hover,.abc-A.on{background:var(--teal);color:#fff;}
.abc-B{border-color:var(--blue);color:var(--blue);background:var(--bl);}
.abc-B:hover,.abc-B.on{background:var(--blue);color:#fff;}
.abc-C{border-color:var(--amber);color:var(--amber);background:var(--al);}
.abc-C:hover,.abc-C.on{background:var(--amber);color:#fff;}
.prob-n{display:inline-flex;align-items:center;gap:8px;margin-bottom:.9rem;}
.prob-n .n{width:28px;height:28px;border-radius:6px;font-size:.85rem;font-weight:700;display:flex;align-items:center;justify-content:center;}
.n-pr{background:var(--blue);color:#fff;}
.n-cf{background:var(--amber);color:#fff;}
.prob-n span{font-size:12px;color:var(--text3);}
.prob-divider{border:none;border-top:1px dashed var(--bd);margin:1.8rem 0 1.5rem;}
.hl-x{color:var(--pink);font-weight:700;}
.hl-t{color:var(--teal);font-weight:700;}
.fb-ok{display:none;align-items:center;gap:12px;background:#e6faf3;border:2px solid #0d9478;border-radius:12px;padding:12px 16px;margin:8px 0 4px;animation:fbPop .3s ease;}
.fb-ng{display:none;align-items:center;gap:12px;background:#fde8eb;border:2px solid #d93652;border-radius:12px;padding:12px 16px;margin:8px 0 4px;animation:fbPop .3s ease;}
.mini-fb{display:none;border-radius:9px;padding:10px 14px;margin:.5rem 0;font-size:13px;line-height:1.9;animation:fbPop .25s ease;}
.mini-fb.ok{background:#e6faf3;border:1.5px solid var(--teal);color:#0a6b54;}
.mini-fb.ng{background:var(--pl);border:1.5px solid var(--pink);color:#8b1a2c;}
@keyframes fbPop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.reset-btn{background:none;border:1.5px solid #d93652;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;color:#d93652;cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-left:auto;flex-shrink:0;transition:all .15s;white-space:nowrap;}
.reset-btn:hover{background:#d93652;color:#fff;}
.fb-icon{font-size:1.7rem;flex-shrink:0;}
.fb-text{font-size:13px;font-weight:700;line-height:1.5;}
.fb-ok .fb-text{color:#0d9478;}
.fb-ng .fb-text{color:#d93652;}
.fb-sub{font-size:11px;font-weight:400;display:block;margin-top:1px;opacity:.8;}
.unit-nav{display:none;flex-direction:column;gap:10px;margin:1.8rem 0 0;padding-top:1.4rem;border-top:2px dashed #d6d2c8;}
.unit-nav-row{display:flex;gap:8px;flex-wrap:wrap;}
.unav-btn{flex:1;min-width:120px;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;border:2px solid;font-family:'Noto Sans JP',sans-serif;transition:all .15s;text-align:center;}
.unav-next{background:#2055b0;border-color:#2055b0;color:#fff;}
.unav-next:hover{background:#153a80;}
.mini-card{background:#faf8ff;border:2px solid #c8b8e8;border-radius:var(--r);padding:1.2rem 1.4rem;margin-bottom:1rem;}
.mini-q{font-size:14px;line-height:2;color:var(--text);margin-bottom:.8rem;}
.mini-q strong{color:var(--pink);}
.mini-section-label{font-size:11px;font-weight:700;color:#7b3f9e;letter-spacing:.08em;margin-bottom:.7rem;display:flex;align-items:center;gap:6px;}
.mini-section-label::before{content:'';width:3px;height:13px;border-radius:2px;background:#7b3f9e;display:inline-block;}
/* ===== 事務処理検査用の追加 ===== */
.choices .ch:last-child:nth-child(odd){grid-column:1/-1;}
.mini-choices .mch:last-child:nth-child(odd){grid-column:1/-1;}
.cmp{background:var(--sf2);border:1.5px solid var(--bd);border-radius:10px;padding:.8rem 1rem;margin:.4rem 0 1rem;display:flex;flex-direction:column;gap:6px;overflow-x:auto;}
.cmp.sm{margin:.3rem 0 .6rem;background:#fff;}
.cmp-row{display:flex;align-items:center;gap:12px;}
.cmp-l{font-size:11px;font-weight:700;color:var(--text3);width:1.8em;flex-shrink:0;}
.cmp-s{font-family:'DM Mono','Noto Sans JP',monospace;font-size:24px;white-space:nowrap;}
.cmp.sm .cmp-s{font-size:20px;}
.cmp-s i{font-style:normal;display:inline-block;min-width:1.5em;text-align:center;border-radius:5px;}
.cmp-s i.d{background:#fde8eb;color:var(--pink);font-weight:700;}
.rep-table{max-width:420px;margin:.4rem auto .6rem;}
.rep-table th{font-size:15px;width:20%;}
.rep-table td{font-size:17px;font-weight:700;}
.eq{font-family:'DM Mono','Noto Sans JP',monospace;font-size:26px;font-weight:700;text-align:center;letter-spacing:.08em;margin:.4rem 0 1.1rem;color:#1a3a7a;}
.eq .q{color:var(--pink);}
.eq-sm{font-family:'DM Mono','Noto Sans JP',monospace;font-size:18px;font-weight:700;color:#1a3a7a;}
.mini-eq{font-family:'DM Mono','Noto Sans JP',monospace;font-size:17px;font-weight:700;color:#1a3a7a;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:2px 10px;display:inline-block;margin:2px 0;}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;margin:.8rem 0;}
.flow .fs{background:var(--bl);border:1.5px solid #a8c0e8;border-radius:9px;padding:.6rem .9rem;font-size:13px;line-height:1.8;color:#1a3a7a;}
.flow .fa{text-align:center;color:var(--blue);font-size:14px;line-height:1.3;}
@media(max-width:480px){.cmp-s{font-size:20px}.eq{font-size:21px}}
/* ===== 目次ページ ===== */
.page-title-block{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.2rem 1.4rem;margin-bottom:1.6rem;display:flex;align-items:center;gap:14px;}
.ptb-icon{width:48px;height:48px;border-radius:10px;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;flex-shrink:0;}
.ptb-label{font-size:11px;color:var(--text3);letter-spacing:.08em;margin-bottom:3px;}
.ptb-title{font-size:17px;font-weight:700;color:var(--text);}
.ptb-desc{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.6;}
.overall-prog{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.9rem 1.3rem;margin-bottom:1.4rem;}
.op-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;}
.op-label{font-size:12px;font-weight:700;color:var(--text2);}
.op-count{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;}
.op-bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;}
.op-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:4px;transition:width .6s ease;width:0%;}
.unit-list{display:flex;flex-direction:column;gap:.75rem;margin-bottom:1.6rem;}
.unit-card{background:var(--sf);border:1.5px solid var(--bd);border-radius:var(--r);text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;transition:all .18s;position:relative;}
.unit-card:hover{border-color:var(--blue);box-shadow:0 2px 12px rgba(32,85,176,.10);transform:translateY(-1px);}
.unit-card.done{border-color:var(--teal);}
.uc-main{display:flex;align-items:center;gap:14px;padding:1rem 1.2rem .85rem;}
.uc-num{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;flex-shrink:0;font-family:'DM Mono',monospace;}
.uc-num.c1{background:#fde8eb;color:var(--pink);}.uc-num.c2{background:var(--bl);color:var(--blue);}.uc-num.c3{background:var(--tl);color:var(--teal);}.uc-num.c4{background:var(--al);color:var(--amber);}.uc-num.c5{background:#f8f0ff;color:#6b21a8;}.uc-num.c6{background:#f0f8ef;color:#166534;}
.uc-body{flex:1;min-width:0;}
.uc-category{font-size:10px;color:var(--text3);letter-spacing:.07em;margin-bottom:2px;}
.uc-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px;line-height:1.4;}
.uc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.uc-tag{font-size:10px;font-weight:700;border-radius:20px;padding:2px 8px;letter-spacing:.04em;white-space:nowrap;}
.tag-pink{background:var(--pl);color:var(--pink);}.tag-blue{background:var(--bl);color:var(--blue);}.tag-teal{background:var(--tl);color:var(--teal);}.tag-amber{background:var(--al);color:var(--amber);}

<main>
<div class="page-title-block"><div class="ptb-icon" style="background:#6b21a8">復</div><div><div class="ptb-label">まちがい・不安・わからない問題</div><div class="ptb-title">復習する</div><div class="ptb-desc">各単元でまちがえた問題や、「🔖 あとで復習」にした問題が集まります。2回続けて正解すると、リストから外れます。</div></div></div>

<script>
var RV_FILTER=null;
/* ===== 復習（まちがい・あとで復習）===== */
var RVK='spi_review_v1';
function rvLoad(){try{return JSON.parse(localStorage.getItem(RVK)||'{}');}catch(e){return {};}}
function rvSave(o){try{localStorage.setItem(RVK,JSON.stringify(o));}catch(e){}}
function rvAdd(id,item){var o=rvLoad();if(o[id]){o[id].streak=0;if(item.why==='later')o[id].why='later';}else{item.streak=0;o[id]=item;}rvSave(o);rvBadge();}
function rvDel(id){var o=rvLoad();delete o[id];rvSave(o);rvBadge();}
function rvItems(f){var o=rvLoad();return Object.keys(o).map(function(k){var x=o[k];x.id=k;return x;}).filter(function(x){return !f||f(x);});}
function rvBadge(){var b=document.getElementById('rvbadge');if(!b||typeof RV_FILTER==='undefined')return;var n=rvItems(RV_FILTER).length;b.textContent=n?n:'';b.style.display=n?'inline-flex':'none';}
function rvCapture(q,why){
  try{
    var card=document.getElementById('card-'+q),chw=document.getElementById('ch-'+q);if(!card||!chw)return;
    var bs=chw.querySelectorAll('.ch');
    var a=+bs[0].getAttribute('onclick').match(/,(\d+)\)/)[1];
    var ch=[].map.call(bs,function(b){return b.innerHTML.replace(/<span class="cnum">.*?<\/span>/,'');});
    var steps=[].map.call(document.getElementById('kai-'+q).querySelectorAll('.exp-box'),function(e){var c=e.cloneNode(true);var h=c.querySelector('h4');var t=h.innerHTML.replace(/^STEP \d+　/,'');h.remove();return [t,c.innerHTML];});
    var hints=[1,2,3].map(function(k){var h=document.getElementById('hint-'+q+'-'+k);return h?h.innerHTML.replace(/^<b>ヒント\d<\/b>/,''):'';});
    var kp=document.getElementById(q+'-res').querySelector('.point-box');
    rvAdd(COURSE+':'+UNIT+':'+q,{u:COURSE+':'+UNIT,ut:UTITLE,why:why,q:card.querySelector('.q-text').innerHTML,ch:ch,a:a,steps:steps,hints:hints,key:kp?kp.innerHTML.replace(/^<strong>.*?<\/strong>/,''):''});
  }catch(e){}
}
function later(q){
  var id=COURSE+':'+UNIT+':'+q,b=document.getElementById('lb-'+q),o=rvLoad();
  if(o[id]&&o[id].why==='later'){rvDel(id);b.classList.remove('on');b.textContent='🔖 あとで復習';return;}
  rvCapture(q,'later');b.classList.add('on');b.textContent='🔖 復習リストに入れました（もう一度押すと取り消し）';
}
var RVS={queue:[],i:0,ok:0,grad:0,root:null,filter:null,cur:null};
var RVWHY={wrong:'まちがい',later:'あとで復習',mark:'理解度B・C',mogi:'模擬試験'};
function rvEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function rvMount(rootId,filter){
  RVS.root=document.getElementById(rootId);RVS.filter=filter||null;rvList();
}
function rvList(){
  var items=rvItems(RVS.filter),r=RVS.root;
  if(!items.length){r.innerHTML='<div class="card"><div class="sec-head"><div class="sec-num">復</div>復習する問題</div><p class="body-text">いまは、復習する問題がありません。🎉<br>演習・確認問題でまちがえた問題や、「🔖 あとで復習」を押した問題が、ここに集まります。</p></div>';return;}
  var g={};items.forEach(function(x){(g[x.ut]=g[x.ut]||[]).push(x);});
  var h='<div class="card"><div class="sec-head"><div class="sec-num">復</div>復習する問題（'+items.length+'問）</div><p class="body-text">まちがえた問題と、「あとで復習」「理解度B・C」にした問題です。<b>2回続けて正解すると、リストから外れます。</b></p><button class="start-btn" onclick="rvStart(null)">ぜんぶ復習する（'+items.length+'問）</button></div>';
  Object.keys(g).forEach(function(t,gi){
    h+='<div class="card"><div class="rv-gh"><b>'+rvEsc(t)+'</b><span>'+g[t].length+'問</span><button class="m-btn" onclick="rvStart('+gi+')">この単元を復習</button></div>';
    g[t].forEach(function(x){h+='<div class="rv-row"><span class="rv-tag">'+RVWHY[x.why||'wrong']+'</span><span class="rv-st">'+(x.streak?'あと1回で卒業':'')+'</span><button class="rv-del" onclick="rvRemove(\''+x.id.replace(/'/g,"\\'")+'\')">リストから外す</button></div>';});
    h+='</div>';
  });
  r.innerHTML=h;RVS.groups=Object.keys(g);
}
function rvRemove(id){if(!confirm('この問題を復習リストから外しますか？'))return;rvDel(id);rvList();}
function rvStart(gi){
  var items=rvItems(RVS.filter);
  if(gi!==null&&RVS.groups)items=items.filter(function(x){return x.ut===RVS.groups[gi];});
  for(var i=items.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=items[i];items[i]=items[j];items[j]=t;}
  RVS.queue=items;RVS.i=0;RVS.ok=0;RVS.grad=0;rvShow();
}
function rvShow(){
  var r=RVS.root,x=RVS.queue[RVS.i];
  if(!x){
    var left=rvItems(RVS.filter).length;
    r.innerHTML='<div class="m-sum"><div>復習おつかれさまでした</div><div class="big">'+RVS.ok+' / '+RVS.queue.length+'</div><div class="sub">正解 '+RVS.ok+'問　／　リストから卒業 '+RVS.grad+'問<br>のこり '+left+'問</div></div><div class="m-tools"><button onclick="rvList();window.scrollTo(0,0)">一覧へ</button>'+(left?'<button onclick="rvStart(null)">のこりをもう一度</button>':'')+'</div>';
    window.scrollTo(0,0);return;
  }
  RVS.cur=x;RVS.hint=0;
  var h='<div class="prog-wrap"><div class="pb-w"><div class="pb pb-pr" style="width:'+(RVS.i/RVS.queue.length*100)+'%"></div></div><div class="pb-txt">'+(RVS.i+1)+' / '+RVS.queue.length+'</div></div>';
  h+='<div class="card"><div class="clabel pr">復習　'+rvEsc(x.ut)+'</div><div class="q-text">'+x.q+'</div>';
  var hs=(x.hints||[]).filter(function(t){return t;});
  if(hs.length){h+='<div class="hint-row">';for(var k=1;k<=hs.length;k++)h+='<button class="hint-btn" id="rh-'+k+'"'+(k>1?' disabled':'')+' onclick="rvHint('+k+')">💡 ヒント'+k+'</button>';h+='</div>';hs.forEach(function(t,k){h+='<div class="hint-box" id="rhb-'+(k+1)+'"><b>ヒント'+(k+1)+'</b>'+t+'</div>';});}
  h+='<div class="choices" id="rch">';
  x.ch.forEach(function(c,i){h+='<button class="ch" onclick="rvAns('+i+')"><span class="cnum">'+'ABCDEFG'.charAt(i)+'</span>'+c+'</button>';});
  h+='</div><div id="rfb"></div></div>';
  r.innerHTML=h;window.scrollTo(0,0);
}
function rvHint(k){document.getElementById('rhb-'+k).style.display='block';document.getElementById('rh-'+k).classList.add('used');var n=document.getElementById('rh-'+(k+1));if(n)n.disabled=false;}
function rvAns(i){
  var x=RVS.cur,bs=document.querySelectorAll('#rch .ch');
  bs.forEach(function(b){b.disabled=true;});bs[x.a].classList.add('ok');
  var o=rvLoad(),it=o[x.id],msg;
  if(i===x.a){
    RVS.ok++;var s=(it&&it.streak||0)+1;
    if(s>=2){rvDel(x.id);RVS.grad++;msg='⭕ 正解！2回続けて正解したので、<b>リストから卒業</b>です。🎓';}
    else{if(it){it.streak=s;rvSave(o);}msg='⭕ 正解！あと<b>1回</b>正解すると卒業です。';}
  }else{bs[i].classList.add('ng');if(it){it.streak=0;rvSave(o);}msg='❌ 正解は <b>'+'ABCDEFG'.charAt(x.a)+'</b> です。解説を読んで、もう一度挑戦しましょう。';}
  var h='<div class="'+(i===x.a?'fb-ok':'fb-ng')+'" style="display:flex"><span class="fb-text">'+msg+'</span></div>';
  x.steps.forEach(function(s,k){h+='<div class="exp-box'+['',' blue',' amber'][k%3]+'" style="display:block"><h4>STEP '+(k+1)+'　'+s[0]+'</h4>'+s[1]+'</div>';});
  if(x.key)h+='<div class="point-box"><strong>🔑 解法のカギ</strong>'+x.key+'</div>';
  h+='<button class="start-btn" onclick="RVS.i++;rvShow()">'+(RVS.i+1>=RVS.queue.length?'結果を見る':'次の問題へ')+'</button>';
  document.getElementById('rfb').innerHTML=h;rvBadge();
  setTimeout(function(){var e=document.getElementById('rfb');if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth',block:'start'});},100);
}

rvMount('rv-root',null);
</script></body></html>
